name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-targets --all-features

  build-xll:
    name: Build XLL (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build XLL
        run: cargo build --release --target ${{ matrix.target }}
      - name: Locate XLL artifact
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/rust_sqlite.xll"
          if (-not (Test-Path $src)) {
            $dll = "target/${{ matrix.target }}/release/rust_sqlite.dll"
            if (Test-Path $dll) {
              Rename-Item $dll $src -Force
              Write-Host "Renamed .dll -> .xll"
            } else {
              Write-Error "Neither .xll nor .dll found at target/${{ matrix.target }}/release/"
              exit 1
            }
          }
          Write-Host "XLL path: $src"
      - uses: actions/upload-artifact@v4
        with:
          name: rust_sqlite_${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rust_sqlite.xll
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build-xll
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_sqlite_x86_64-pc-windows-msvc
          path: artifacts/x64
      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_sqlite_i686-pc-windows-msvc
          path: artifacts/x86
      - name: Rename artifacts
        run: |
          mv artifacts/x64/rust_sqlite.xll artifacts/rust_sqlite_x64.xll
          mv artifacts/x86/rust_sqlite.xll artifacts/rust_sqlite_x86.xll
          ls -la artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rust_sqlite_x64.xll
            artifacts/rust_sqlite_x86.xll
          generate_release_notes: true