name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-targets --all-features

  build-xll:
    name: Build XLL (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Verify XLL artifact
        shell: pwsh
        run: |
          $hostTarget = (rustc -vV | Select-String "host:").Line.Split()[1]
          $buildTarget = "${{ matrix.target }}"
          if ($buildTarget -eq $hostTarget) {
            $xll = "target/release/rust_sqlite.xll"
            $dll = "target/release/rust_sqlite.dll"
          } else {
            $xll = "target/$buildTarget/release/rust_sqlite.xll"
            $dll = "target/$buildTarget/release/rust_sqlite.dll"
          }
          if (Test-Path $xll) {
            Write-Host "XLL found: $xll"
          } elseif (Test-Path $dll) {
            Copy-Item $dll $xll -Force
            Write-Host "Copied DLL -> XLL: $xll"
          } else {
            Write-Error "No .xll or .dll found"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rust_sqlite_${{ matrix.target }}
          path: target/**/release/rust_sqlite.xll
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build-xll
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_sqlite_x86_64-pc-windows-msvc
          path: artifacts/x64
      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: rust_sqlite_i686-pc-windows-msvc
          path: artifacts/x86
      - name: Rename artifacts
        run: |
          mv artifacts/x64/rust_sqlite.xll artifacts/rust_sqlite_x64.xll
          mv artifacts/x86/rust_sqlite.xll artifacts/rust_sqlite_x86.xll
          ls -la artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rust_sqlite_x64.xll
            artifacts/rust_sqlite_x86.xll
          generate_release_notes: true