[package]
name = "rust-sqlite"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xll-rs = "0.1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lazy_static = "1.5"
csv = "1.3"
encoding_rs = "0.8"

[build-dependencies]
xll-rs = "0.1.1"

[dev-dependencies]
tempfile = "3.14"
